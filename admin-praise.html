  <title>찬양 아카이브 · 관리자</title>
  <link rel="icon" href="favicon.png" />
  <!--
    🎵 찬양 아카이브 관리는 교회 어드민으로 갈아탔다(2026-10-13 · 친구 확인 「찬양 확인 완료」).
    교회 어드민 「🎵 찬양 아카이브」(묶음 6 · 2026-10-09)가 찬양 함수(praise)를 내부 키로 부른다.
    찬양 함수는 이날부터 관리자 암호 하나로는 관리자가 아니다(praise-songs 6ff4948) — 그래서 옛 화면(곡 등록·콤보 순서·조회수·
    사용 현황)은 더 동작하지 않아 안내만 둔다. 옛 화면 원문은 git 기록에 있다 · praise-api.js·praise-config.js 와 함께
    마지막 걷기(묶음 7)에 지운다. 되살리지 말 것 — 찬양 관리를 고칠 때는 교회 어드민(c:\Projects\church-admin)에서.
  -->
  <style>
    body { margin:0; background:#f4f6fa; color:#1c2430; font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif; }
    .card { max-width:420px; margin:48px auto; padding:26px 22px; background:#fff; border:1px solid #e3e8f0; border-radius:16px;
            box-shadow:0 2px 10px rgba(26,58,107,.06); text-align:center; word-break:keep-all; }
    h1 { font-size:19px; color:#1a3a6b; margin:0 0 12px; }
    p { font-size:14.5px; line-height:1.7; color:#3a4554; margin:0 0 18px; }
    .go { display:block; width:100%; padding:13px; border:0; border-radius:11px; background:#1a3a6b; color:#fff;
          font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
    .back { display:inline-block; margin-top:14px; color:#6a7688; font-size:13px; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎵 찬양 아카이브 관리는 교회 어드민으로 옮겼어요</h1>
    <p>곡 등록 · 콤보 순서 · 조회수 · 사용 현황은 이제 <b>교회 어드민</b>의 「🎵 찬양 아카이브」에서 해요.
      카카오로 로그인해 승인을 받고 「설교·찬양」 역할을 받으면 보여요. 관리자 암호로는 더 들어오지 않아요.</p>
    <button class="go" id="go">교회 어드민 열기</button>
    <a class="back" href="admin.html">← 관리자 허브로</a>
  </div>
  <script>
    document.getElementById("go").addEventListener("click", function () {
      window.open("https://admin.onlybible.kr/", "_blank", "noopener");
    });
  </script>
</body>
</html>
