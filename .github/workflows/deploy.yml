name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 새 배포가 시작되면 진행 중인 배포는 취소(큐 쌓임 방지)
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 배포 전 점검 — 여기서 실패하면 아래 배포 단계가 아예 안 돈다.
      # 이 저장소는 push 가 곧 배포라, 문법이 깨진 app.js 가 나가면 전 성도의 앱이
      # 통째로 안 뜨는데 오류창도 안 떠서(스플래시가 7초 뒤 닫히고 멈춘다) 제보가
      # 올 때까지 아무도 모른다. 푸시 전에 손으로도 돌려 볼 수 있다:
      #   python tools/preflight.py
      - name: 배포 전 점검 (문법 · 캐시태그)
        run: python3 tools/preflight.py

      # 화면이 쓰는 파일만 사이트로 내보낸다(2026-10-08) — 목록은 tools/site.py 한 곳.
      # 전에는 저장소를 통째로 올려 CLAUDE.md·docs/·supabase/·tools/·tests/·booklet/·네이티브 앱 소스가 주소로 열렸다.
      # ⚠️ 새 화면 폴더를 만들면 tools/site.py 의 SITE_DIRS 에 더할 것 — 안 그러면 localhost 에서는 되고 운영에서만 404.
      - name: 사이트로 낼 것만 모으기
        run: python3 tools/site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v4
