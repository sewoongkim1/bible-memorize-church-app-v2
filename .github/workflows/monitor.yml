name: 장애 모니터 (매일 아침 점검 + 텔레그램 경보)

on:
  schedule:
    - cron: '12 22 * * *'   # 매일 22:12 UTC = 07:12 KST (정기 발송 7:00 직후, 미발송 판정 07:08 이후에 점검)
  workflow_dispatch:        # 수동 실행(테스트)용
    inputs:
      force_alert:
        description: '경보 채널 테스트(텔레그램으로 샘플 경보 발송)'
        type: boolean
        default: false
      weekly_test:
        description: '주간 리포트 테스트 발송(지금 이메일 보내기)'
        type: boolean
        default: false
      report_from:
        description: '주간 리포트 시작일(YYYY-MM-DD, 비우면 자동=전주금~이번주목)'
        type: string
        default: ''
      report_to:
        description: '주간 리포트 종료일(YYYY-MM-DD)'
        type: string
        default: ''

jobs:
  monitor:
    # 시크릿을 이 환경 안에 둔다. 환경은 main 가지에서 도는 실행만 허용한다
    # — 다른 가지에 워크플로를 올려도 MONITOR_KEY·TELEGRAM_*에 손이 닿지 않는다.
    # MONITOR_KEY(2026-10-13): 관리자 암호 대신 api 가 monitor · weeklyReport(크론 꼴)만 열어 주는 전용 키(머리 x-machine-key).
    #   새도 그 둘만 열린다. 「발송 진단」 수동 버튼은 이때 뺐다 — 사람을 안 고르면 모든 구독자에게 실제로 보내는 버튼이었다.
    #    (저장소 시크릿은 어느 가지에서든 읽힌다 — 협업자가 생긴 뒤에 닫은 구멍, 2026-08-28)
    environment: production
    runs-on: ubuntu-24.04   # 2026-10-19 ubuntu-latest 가 26 으로 바뀜 — 올릴 때를 우리가 고른다
    steps:
      - name: 백엔드 상태 점검 + 문제 시 텔레그램 경보
        env:
          API_URL: https://xnomlgydifiqiybervtf.supabase.co/functions/v1/api
          ANON: sb_publishable_oLtieT_jw7Gjb8etEsy0jw_thBaDjl-
          MONITOR_KEY: ${{ secrets.MONITOR_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALERT: ${{ github.event.inputs.force_alert }}
          WEEKLY_TEST: ${{ github.event.inputs.weekly_test }}
          REPORT_FROM: ${{ github.event.inputs.report_from }}
          REPORT_TO: ${{ github.event.inputs.report_to }}
          CA_SITE: https://admin.onlybible.kr/
          CA_FN: https://xnomlgydifiqiybervtf.supabase.co/functions/v1/church-admin
        run: |
          set -uo pipefail

          # 0) 아직 설정(시크릿) 전이면 조용히 스킵 (실패 알림 방지)
          if [ -z "${MONITOR_KEY:-}" ]; then
            echo "⏭️  MONITOR_KEY 미설정 — 점검 건너뜀"; exit 0
          fi

          # 0-0) 주간 리포트 테스트 발송(지금 이메일 전송) — 기간은 서버가 '전주 금~이번주 목'으로 자동 계산
          if [ "${WEEKLY_TEST:-false}" = "true" ]; then
            echo "📧 주간 리포트 테스트 발송..."
            body="{\"action\":\"weeklyReport\",\"send\":true"
            [ -n "${REPORT_FROM:-}" ] && body="$body,\"from\":\"$REPORT_FROM\""
            [ -n "${REPORT_TO:-}" ] && body="$body,\"to\":\"$REPORT_TO\""
            body="$body}"
            curl -s -m 60 -X POST "$API_URL" -H "Content-Type: application/json" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "x-machine-key: $MONITOR_KEY" -d "$body"
            echo ""; exit 0
          fi

          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "⏭️  텔레그램 시크릿 미설정 — 점검 건너뜀"; exit 0
          fi

          # 0-1) 경보 채널 테스트 모드: 샘플 경보만 보내고 종료
          if [ "${FORCE_ALERT:-false}" = "true" ]; then
            text="[성경암송 모니터] 🔔 경보 채널 테스트"$'\n'"이 메시지가 보이면 장애 경보가 정상 작동합니다."
            curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=${text}" >/dev/null || true
            echo "테스트 경보 발송 완료"; exit 0
          fi

          # 1) monitor 엔드포인트 호출 (백엔드/DB/발송/데이터 종합 점검)
          #    src "gha" = 이 부름이 GitHub 에서 왔다 — api 가 흔적(app_config monitorRun)을 남기고, Supabase 크론 monitor-watch 가
          #    그 흔적이 36시간을 넘으면 메일로 알린다(GitHub 이 60일 무커밋으로 이 워크플로를 꺼도 알 수 있게 · docs/notes/monitor-guard.md).
          resp=$(curl -s -m 30 -w $'\n%{http_code}' -X POST "$API_URL" \
            -H "Content-Type: application/json" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "x-machine-key: $MONITOR_KEY" \
            -d "{\"action\":\"monitor\",\"src\":\"gha\"}")
          code=$(printf '%s' "$resp" | tail -n1)
          json=$(printf '%s' "$resp" | sed '$d')

          # 2) 경보 문구 결정
          alert=""
          if [ "$code" != "200" ]; then
            alert="🔴 백엔드 응답 이상 (HTTP ${code:-timeout})"$'\n'"— Edge Function / Supabase 확인 필요"
          else
            ok=$(printf '%s' "$json" | jq -r '.ok // false')
            if [ "$ok" != "true" ]; then
              probs=$(printf '%s' "$json" | jq -r '.problems[]? | "• " + .')
              alert="🔴 장애 감지"$'\n'"$probs"
            fi
          fi

          # 2-1) 교회 어드민(admin.onlybible.kr · 함수 church-admin) — 공개로 볼 수 있는 것만(키 없음 · 쓰는 요청 없음 · docs/notes/monitor-guard.md)
          #   · 화면: 200 이어야
          #   · 함수: 토큰 없이 부르면 함수 자신이 {"ok":false,"error":"unauthenticated"} + 401 을 준다 — 이것이 「살아 있다」.
          #     부팅 실패·삭제·게이트웨이 오류는 다른 꼴(5xx · 404 · 다른 본문)로 온다.
          #   한 번 빗나가면 20초 뒤 한 번 더 본다(순간 오류로 헛경보를 내지 않게).
          ca_check() {
            local site fresp fcode fjson out=""
            site=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$CA_SITE" || true)
            [ "$site" = "200" ] || out="${out}• 화면 admin.onlybible.kr 응답 ${site:-없음}"$'\n'
            fresp=$(curl -s -m 20 -w $'\n%{http_code}' -X POST "$CA_FN" -H "Content-Type: application/json" -d '{"action":"me"}' || true)
            fcode=$(printf '%s' "$fresp" | tail -n1)
            fjson=$(printf '%s' "$fresp" | sed '$d')
            if [ "$fcode" != "401" ] || ! printf '%s' "$fjson" | grep -q '"error":"unauthenticated"'; then
              out="${out}• 함수 church-admin 응답이 이상합니다 (HTTP ${fcode:-없음} · $(printf '%s' "$fjson" | tr -d '\n' | head -c 120))"$'\n'
            fi
            printf '%s' "$out"
          }
          ca=$(ca_check)
          if [ -n "$ca" ]; then sleep 20; ca=$(ca_check); fi
          if [ -n "$ca" ]; then
            ca_block="🔴 교회 어드민"$'\n'"$ca"
            if [ -n "$alert" ]; then alert="$alert"$'\n\n'"$ca_block"; else alert="$ca_block"; fi
          fi

          # 3) 문제 있으면 텔레그램 발송, 없으면 정상 종료
          if [ -n "$alert" ]; then
            nowkst=$(date -u -d '+9 hours' '+%m-%d %H:%M')
            text="[성경암송 모니터] ${nowkst} KST"$'\n'"$alert"
            if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
              curl -s -m 20 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TG_CHAT}" \
                --data-urlencode "text=${text}" >/dev/null || true
            fi
            echo "::error::$alert"
            echo "$json"
            exit 1
          fi

          echo "✅ 정상(교회 어드민 화면·함수 포함): $json"
