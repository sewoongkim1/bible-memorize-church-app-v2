<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // 야간(다크) 모드: 기본값은 화이트, 사용자가 직접 선택해 저장한 경우만 다크 적용
    (function () {
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
        // 글씨 크기(고령 성도 배려): lg=크게, xl=아주 크게. 기본(보통)은 속성 없음
        var fs = localStorage.getItem("fontscale");
        if (fs === "lg" || fs === "xl") document.documentElement.setAttribute("data-fs", fs);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- 글꼴은 화면 그리기를 막지 않게 나중에 적용한다.
       한글 웹폰트 넷을 부르면 이 CSS 하나가 765KB다(앱 전체보다 크다). 예전처럼
       rel="stylesheet"로 두면 이걸 다 받을 때까지 **스플래시조차 안 뜬다** —
       느린 통신에서 처음 설치한 분이 흰 화면만 보게 된다(2026-08-27 확인).
       media="print"로 받아 두었다가 다 받으면 그때 적용한다. display=swap 이라
       그전까지는 기기 기본 글꼴로 먼저 보이고, 준비되면 슬쩍 바뀐다. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Lora:wght@400;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Lora:wght@400;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" /></noscript>

</head>
<body>
  <!-- 앱 시작 스플래시 화면 -->
  <div id="splash">
    <div class="splash-inner">
      <img id="splash-logo" src="https://summer.onlybible.kr/logo3.png" alt="고척교회" />

      <div class="splash-sub">주의 말씀은 내 발에 등이요<br>내 길에 빛이니이다</div>
      <div class="splash-ver">v3.222</div>
      <img class="splash-denom" src="logo3.png?v=20260702y" alt="대한예수교장로회총회" onerror="this.style.display='none'" />
    </div>
  </div>
  <script>
    window.__splashStart = Date.now(); // 스플래시 최소 노출 시간 계산용
    // 스플래시 숨기기 — 보통은 app.js가 준비를 마치고 부른다.
    window.hideSplash = function () {
      var s = document.getElementById("splash");
      if (!s) return;
      s.classList.add("hide");
      setTimeout(function () { if (s && s.parentNode) s.parentNode.removeChild(s); }, 450);
    };
    // 안전장치 — app.js가 아예 못 뜨는 경우에만 쓰인다(평소엔 app.js의 SPLASH_MIN_MS가 먼저 닫는다).
    setTimeout(window.hideSplash, 7000);
  </script>
