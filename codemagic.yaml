workflows:
  ios-testflight:
    name: iOS TestFlight 업로드
    max_build_duration: 60
    integrations:
      app_store_connect: gocheok_memorize_asc # Codemagic 콘솔에서 이 이름으로 API 키를 등록해 둔다
    environment:
      groups:
        - ios_signing # CERTIFICATE_PRIVATE_KEY (배포 인증서 개인 키)를 secret으로 저장
      vars:
        BUNDLE_ID: "kr.onlybible.gocheok.memorize"
        APP_ID: "6811724527"
      node: 20.11.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: npm install (ios-app)
        script: |
          cd ios-app
          npm install
      - name: 네이티브 iOS 프로젝트 생성 (매 빌드마다 새로)
        script: |
          cd ios-app
          npx cap add ios
          npx cap sync ios
      - name: 코드 서명 설정 가져오기 (자동)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY"
          keychain add-certificates
          xcode-project use-profiles
      - name: 빌드 번호 자동 증가
        script: |
          cd ios-app/ios/App
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" || echo 0)
          NEXT=$(($LATEST + 1))
          echo "빌드 번호를 $NEXT 로 설정"
          agvtool new-version -all "$NEXT" || plutil -replace CFBundleVersion -string "$NEXT" App/Info.plist
      - name: Xcode 빌드
        script: |
          cd ios-app/ios/App
          xcode-project build-ipa \
            --workspace App.xcworkspace \
            --scheme App
    artifacts:
      - ios-app/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
