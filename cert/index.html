<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  // 어두운 모드 — 앱(index.html)과 같은 규칙: 성도님이 앱 설정에서 「어둡게」를 고른 때만(같은 주소라 저장값을 함께 본다)
  (function () { try { if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {} })();
</script>
<title>수료증 진위 확인 · 고척교회</title>
<meta name="description" content="고척교회 교육 수료증의 수료번호로 진짜 수료증인지 확인해요." />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="../favicon.png" />
<!--
  🎓 수료증 진위 확인(교육신청 3단계 · 2026-10-05 · 계획 docs/superpowers/plans/2026-10-05-education-stage3-certificates.md)
  ■ 로그인이 필요 없다 — 수료증을 받은 분이 아니라 「보는 분」이 연다(주소: gocheok.onlybible.kr/cert/?no=고척-2026-0001).
  ■ 서버 eduVerify 는 번호가 **정확히 같은** 한 줄만 찾는다(목록·검색 없음) · 가린 이름(서버가 가린 그대로 — 여기서 다시 가리지 않는다)·과정·학기·수료일만.
  ■ 서버 글자는 모두 textContent 로 넣는다(innerHTML 금지).
  ■ 웹폰트를 부르지 않는다(guide/·quiz/ 와 같은 방침 — 첫 화면을 막지 않게).
  ⚠️ tools/bump.py 는 루트 index.html 만 손본다 — 아래 ../js/config.js·../js/api.js 에는 ?v= 를 붙이지 않았다(붙여 봐야 bump 가 올려 주지 않는다).
     api.js 가 옛 판으로 남아도 되게 api.eduVerify 가 아니라 늘 있는 supaCall 을 직접 부른다.
-->
<style>
:root{
  --navy:#1a3a6b; --navy-dark:#0d1b3e; --gold:#c8a84b; --cream:#fdf8f0; --white:#ffffff; --gray:#6b7280;
  --light:#f3f0ea; --border:#ddd6c8; --green:#2c5f2d; --error:#c0392b; --ink:#1f2937; --title:#1a3a6b;
}
html.dark{ color-scheme:dark; --cream:#0f1218; --white:#1b2233; --light:#232c3f; --border:#33405a; --gray:#9aa6b8; --ink:#e6e9ef; --title:#cdd9f2; }
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
header{text-align:center;padding:4px 0 18px}
.logo{display:block;height:64px;width:auto;margin:0 auto}
h1{font-size:1.45rem;font-weight:800;color:var(--title);margin:12px 0 6px;word-break:keep-all}
.sub{margin:0;color:var(--gray);font-size:.98rem;line-height:1.6;word-break:keep-all}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px}
label{display:block;font-size:.95rem;font-weight:700;color:var(--title);margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;min-height:48px;padding:0 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--white);
  color:var(--ink);font-size:1.1rem;font-family:inherit;letter-spacing:.02em}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(26,58,107,.18)}
button{flex:none;min-width:84px;min-height:48px;padding:0 18px;border:0;border-radius:12px;background:var(--navy);color:#fff;
  font-size:1.05rem;font-weight:800;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.hint{margin:8px 0 0;font-size:.9rem;color:var(--gray);line-height:1.55;word-break:keep-all}
.out{margin-top:14px;border-width:1.5px}
.out[hidden]{display:none}
.out-h{margin:0;font-size:1.2rem;font-weight:800;color:var(--title);word-break:keep-all}
.out.ok{border-color:var(--green);background:#f3faf3}
.out.ok .out-h{color:var(--green)}
.out.rv{border-color:#e8b4ae;background:#fdf1f0}
.out.rv .out-h{color:var(--error)}
.out.wait .out-h{color:var(--gray);font-weight:700;font-size:1rem}
.out dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;margin:12px 0 0;font-size:1.02rem;line-height:1.45}
.out dt{color:var(--gray)}
.out dd{margin:0;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.out-n{margin:10px 0 0;font-size:.92rem;color:var(--gray);line-height:1.6;word-break:keep-all}
.note{margin:18px 2px 0;font-size:.88rem;color:var(--gray);line-height:1.65;word-break:keep-all}
footer{margin-top:22px;text-align:center}
footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;color:var(--navy);font-weight:700;text-decoration:none}
html.dark input:focus{border-color:#8fb3e6;box-shadow:0 0 0 3px rgba(143,179,230,.22)}
html.dark button{background:#2b4c80}
html.dark .out.ok{border-color:#2f5a42;background:#17311f}
html.dark .out.ok .out-h{color:#8fd6ab}
html.dark .out.rv{border-color:#6b4a46;background:#3a2428}
html.dark .out.rv .out-h{color:#f0a49b}
html.dark .out dd{color:#dbe2ee}
html.dark footer a{color:#8fb3e6}
html.dark .logo{box-sizing:content-box;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.92)}   /* 남색 「고척교회」 글씨가 어두운 바탕에 묻히지 않게 — 앱 첫 화면 로고 판(.logo-wrap)과 같은 흰 판 */
</style>
</head>
<body>
<main class="wrap">
  <header>
    <img class="logo" src="../img/logo-gocheok.png" alt="고척교회" width="50" height="64" />
    <h1>수료증 진위 확인</h1>
    <p class="sub">고척교회 교육 수료증의 수료번호를 넣으면 진짜 수료증인지 알려 드려요.</p>
  </header>
  <form class="card" id="f" novalidate autocomplete="off">
    <label for="no">수료번호</label>
    <div class="row">
      <input id="no" name="no" type="text" inputmode="text" maxlength="40" placeholder="고척-2026-0001" autocapitalize="off" spellcheck="false" />
      <button type="submit" id="go">확인</button>
    </div>
    <p class="hint">수료증 왼쪽 위 「제 … 호」에 적힌 번호예요.</p>
  </form>
  <section class="card out" id="out" role="status" aria-live="polite" hidden></section>
  <p class="note">이름은 일부를 가려서 보여 드려요. 번호를 아는 분만 확인할 수 있고, 목록이나 이름 찾기는 없어요.</p>
  <footer><a href="../">성경말씀 암송 앱으로</a></footer>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
// ── 진위 확인 순수 함수 (여기부터) ──
//   tests/edu-front.test.cjs 가 이 표식 사이를 떼어 돌린다. 번호 꼴은 서버 eduCertNoValid(api·교회 어드민 같은 글자)와 같다.
var CERT_NO_RE = /^고척-[0-9]{4}-[0-9]{4,6}$/;
// 넣은 글 다듬기 — NFC · 빈칸 모두 뗌 · 여러 붙임표(‐ ‑ ‒ – — ― − ﹘ ﹣ －)를 「-」로 · 「2026-0001」처럼 「고척-」을 빼고 적으면 붙인다
function certNoNorm(s) {
  var t = String(s == null ? '' : s).normalize('NFC').replace(/[‐-―−﹘﹣－]/g, '-').replace(/\s+/g, '');
  t = t.replace(/^제/, '').replace(/호$/, '');   // 수료증에 찍힌 「제 고척-2026-0001 호」 그대로 붙여 넣어도(검토 2026-10-05)
  if (/^[0-9]{4}-[0-9]{4,6}$/.test(t)) t = '고척-' + t;
  return t;
}
function certYmdKo(d) {   // 2026-12-13 → 2026년 12월 13일 · 틀린 값은 빈 글
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d || '')); if (!m) return '';
  var t = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  if (isNaN(t.getTime()) || t.getUTCDate() !== +m[3]) return '';
  return (+m[1]) + '년 ' + (+m[2]) + '월 ' + (+m[3]) + '일';
}
// 결과 → 보일 것 {tone: ok·rv·none·err, head, rows:[[칸, 값]], note} · r = eduVerify 답 · code = 보내기 전·통신 오류(empty·bad-no·net)
//   이름은 서버가 가린 그대로(r.name) — 여기서 다시 가리지 않는다.
function certVerifyView(r, no, code) {
  var rows = function (a) { return a.filter(function (x) { return x[1] !== null && x[1] !== undefined && String(x[1]) !== ''; }); };
  if (code === 'empty') return { tone: 'none', head: '수료번호를 넣어 주세요', rows: [], note: '예: 고척-2026-0001' };
  if (code === 'bad-no') return { tone: 'none', head: '번호 꼴이 맞지 않아요', rows: [], note: '「고척-해-번호」 꼴로 넣어 주세요. 예: 고척-2026-0001' };
  if (code || !r || r.ok !== true) return { tone: 'err', head: '지금 확인할 수 없어요', rows: [], note: '인터넷 연결을 확인하고 잠시 뒤 다시 해 주세요.' };
  if (r.valid === true) {
    return { tone: 'ok', head: '✅ 확인된 수료증이에요', note: '고척교회가 발급한 수료증이 맞아요.',
      rows: rows([['이름', r.name], ['과정', r.title], ['학기', r.term], ['수료일', certYmdKo(r.completedOn)], ['수료번호', no]]) };
  }
  if (r.revoked === true) {
    return { tone: 'rv', head: '취소된 수료증이에요', note: '이 번호의 수료는 취소됐어요. 궁금하시면 고척교회에 문의해 주세요.',
      rows: rows([['이름', r.name], ['과정', r.title], ['학기', r.term], ['수료번호', no]]) };
  }
  return { tone: 'none', head: '찾을 수 없는 번호예요', rows: [], note: '번호를 다시 확인해 주세요. 수료증 왼쪽 위 「제 … 호」에 적힌 번호예요.' };
}
// ── 진위 확인 순수 함수 (여기까지) ──

(function () {
  var form = document.getElementById('f'), input = document.getElementById('no'), btn = document.getElementById('go'), out = document.getElementById('out');
  var seq = 0;
  // 서버 글자는 모두 textContent 로(innerHTML 을 쓰지 않는다)
  function show(v) {
    out.className = 'card out ' + v.tone;
    out.textContent = '';
    var h = document.createElement('p'); h.className = 'out-h'; h.textContent = v.head; out.appendChild(h);
    if (v.rows && v.rows.length) {
      var dl = document.createElement('dl');
      v.rows.forEach(function (row) {
        var dt = document.createElement('dt'), dd = document.createElement('dd');
        dt.textContent = row[0]; dd.textContent = String(row[1]);
        dl.appendChild(dt); dl.appendChild(dd);
      });
      out.appendChild(dl);
    }
    if (v.note) { var n = document.createElement('p'); n.className = 'out-n'; n.textContent = v.note; out.appendChild(n); }
    out.hidden = false;
  }
  function check() {
    var no = certNoNorm(input.value);
    if (!no) { show(certVerifyView(null, '', 'empty')); input.focus(); return; }
    input.value = no;
    if (!CERT_NO_RE.test(no)) { show(certVerifyView(null, no, 'bad-no')); return; }
    try { history.replaceState(null, '', '?no=' + encodeURIComponent(no)); } catch (e) {}   // 이 주소를 그대로 보내면 같은 결과
    var my = ++seq;
    btn.disabled = true;
    show({ tone: 'wait', head: '확인하는 중…', rows: [], note: '' });
    // ⚠️ supaCall 은 응답에 error 가 있으면 throw 한다(bad-no 등)
    supaCall('eduVerify', { no: no }).then(function (r) {
      if (my === seq) show(certVerifyView(r, no, ''));
    }).catch(function (err) {
      if (my === seq) show(certVerifyView(null, no, err && err.message === 'bad-no' ? 'bad-no' : 'net'));
    }).then(function () { if (my === seq) btn.disabled = false; });
  }
  form.addEventListener('submit', function (e) { e.preventDefault(); check(); });
  var q = null;
  try { q = new URLSearchParams(location.search).get('no'); } catch (e) {}
  if (q) { input.value = q; check(); }
})();
</script>
</body>
</html>
