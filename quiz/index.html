<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>말씀 퀴즈 · 고척교회 성경말씀 암송</title>
<link rel="icon" href="../icon-192.png" />

<!--
  큰 화면(TV·빔) 발표용 말씀 퀴즈. 부서 모임에서 사회자가 진행한다.

  ■ 로그인이 필요 없다 — 교사가 아무 노트북에서나 연다(guide/와 같은 방침).
  ■ 앱 본체(app.js)를 건드리지 않는다 — 여기서 무엇을 고쳐도 성도님 앱에 영향이 없다.
  ■ 웹폰트를 부르지 않는다 — 한글 웹폰트 CSS 하나가 765KB라 첫 화면을 막는다.
    큰 글씨로 띄우는 화면이라 기기 기본 글꼴로 충분하다.

  ⚠️ tools/bump.py 는 루트 index.html 만 손본다. 이 파일의 ../js/config.js 에는
     `?v=` 태그를 붙이지 않았다 — 붙여 봐야 bump가 올려 주지 않아 거짓 안심만 준다.
     config.js 를 고쳤는데 여기에 안 먹으면 새로고침(Ctrl+F5) 한 번이면 된다.
-->

<style>
  /* 배경 네 가지. 빔 프로젝터에는 어두운 쪽이, 밝은 방의 TV에는 밝은 쪽이 낫다.
     색을 전부 변수로 두어 어느 바탕에서도 글씨·선·단추가 함께 따라간다. */
  :root, body[data-bg="navy"] {
    --navy-0:#0b1730; --navy-1:#12244a;
    --ink:#f4f7fc; --dim:#93a6c8; --faint:#5f7399;
    --gold:#e8c169; --gold-dim:#c8a84b; --gold-hi:#f2cd77; --on-gold:#20180a;
    --line:rgba(255,255,255,.15); --soft:rgba(255,255,255,.06); --hover:rgba(255,255,255,.15);
    --disabled:#3b4a68; --veil:rgba(7,14,30,.93); --pick:rgba(232,193,105,.16);
  }
  body[data-bg="black"] {
    --navy-0:#000000; --navy-1:#151515;
    --ink:#ffffff; --dim:#bcbcbc; --faint:#8b8b8b;
    --gold:#f0c96f; --gold-dim:#cfa945; --gold-hi:#f7d98c; --on-gold:#1a1305;
    --line:rgba(255,255,255,.17); --soft:rgba(255,255,255,.07); --hover:rgba(255,255,255,.17);
    --disabled:#3a3a3a; --veil:rgba(0,0,0,.94); --pick:rgba(240,201,111,.18);
  }
  body[data-bg="white"] {
    --navy-0:#ffffff; --navy-1:#f1f4f9;
    --ink:#14203a; --dim:#4d5c78; --faint:#7c8aa3;
    --gold:#9a6f10; --gold-dim:#b08a2a; --gold-hi:#b8862a; --on-gold:#ffffff;
    --line:rgba(20,32,58,.18); --soft:rgba(20,32,58,.05); --hover:rgba(20,32,58,.11);
    --disabled:#ccd5e2; --veil:rgba(255,255,255,.95); --pick:rgba(154,111,16,.13);
  }
  body[data-bg="cream"] {
    --navy-0:#f7f2e6; --navy-1:#fffdf5;
    --ink:#2b2416; --dim:#6a5c42; --faint:#93866c;
    --gold:#8a6413; --gold-dim:#a37f2a; --gold-hi:#a2761c; --on-gold:#fffdf5;
    --line:rgba(43,36,22,.18); --soft:rgba(43,36,22,.05); --hover:rgba(43,36,22,.11);
    --disabled:#ddd3bd; --veil:rgba(247,242,230,.95); --pick:rgba(138,100,19,.13);
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--navy-0); color:var(--ink);
    font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* 빔 프로젝터에서 흰 바탕은 눈부시다 — 어두운 바탕에 흰 글씨로 간다. */

  .screen { position:absolute; inset:0; display:none; flex-direction:column; }
  .screen.on { display:flex; }

  /* ── 설정 ───────────────────────────────── */
  #setup { align-items:center; justify-content:center; gap:0; padding:clamp(24px,4vw,52px) clamp(20px,5vw,48px); overflow-y:auto; }
  .back {
    text-decoration:none; white-space:nowrap; flex:none;
    color:var(--dim); font-size:15px; font-weight:600;
    padding:9px 15px; border-radius:10px;
    border:1px solid var(--line); background:var(--soft);
  }
  .back:hover { background:var(--hover); color:var(--ink); }
  .back:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .card {
    width:min(700px,100%); background:var(--navy-1);
    border:1px solid var(--line); border-radius:20px;
    padding:clamp(26px,4.5vw,44px); display:flex; flex-direction:column; gap:26px;
  }
  .brand { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px 18px; margin-bottom:4px; }
  .brand h1 { margin:0; font-size:clamp(26px,4vw,36px); font-weight:800; letter-spacing:-.02em; }
  .brand p { margin:0; color:var(--dim); font-size:15px; }

  .field { display:flex; flex-direction:column; gap:11px; }
  /* 단추가 둘뿐인 칸은 나란히 — 세로로 쌓으면 화면이 넘쳐 스크롤이 생긴다. */
  .pair { display:flex; gap:18px 22px; flex-wrap:wrap; }
  .pair .field { flex:1 1 240px; }
  .field > .lab { font-size:15px; font-weight:700; color:var(--dim); }
  .opts { display:flex; flex-wrap:wrap; gap:9px; }
  .opt {
    flex:1 1 0; min-width:58px; padding:14px 10px; border-radius:12px;
    background:var(--soft); border:2px solid transparent;
    color:var(--ink); font:inherit; font-size:19px; font-weight:700;
    cursor:pointer; transition:background .12s, border-color .12s;
  }
  .opt:hover { background:var(--hover); }
  .opt[aria-pressed="true"] { background:var(--pick); border-color:var(--gold); color:var(--gold); }
  .opt:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

  .hint-line { margin:0; color:var(--faint); font-size:13.5px; line-height:1.6; }

  /* 수동·자동 단추와 초 입력을 한 줄에. 좁으면 아래로 접힌다. */
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row .opts { flex:1 1 180px; }
  .secs { display:none; align-items:center; gap:9px; color:var(--dim); font-size:15px; flex:none; }
  .secs.on { display:flex; }
  .secs input {
    width:86px; padding:13px 10px; border-radius:11px;
    border:1px solid var(--line); background:var(--soft);
    color:var(--ink); font:inherit; font-size:19px; font-weight:700; text-align:center;
  }
  .secs input:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }

  .go {
    padding:18px; border:none; border-radius:13px; cursor:pointer;
    background:var(--gold); color:var(--on-gold); font:inherit; font-size:21px; font-weight:800;
  }
  .go:hover { background:var(--gold-hi); }
  .go:disabled { background:var(--disabled); color:var(--faint); cursor:default; }
  .go:focus-visible { outline:3px solid #fff; outline-offset:3px; }


  /* ── 문제 ───────────────────────────────── */
  #play { padding:clamp(20px,4vh,48px) clamp(24px,5vw,80px); }
  .top { display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex:none; }
  .count { font-size:clamp(16px,2.2vw,26px); font-weight:800; color:var(--gold-dim); font-variant-numeric:tabular-nums; }
  /* 교회 마크. 원본이 어두운 로고라 어두운 바탕에서는 흰색으로 뒤집어 쓴다
     (brightness(0) invert(1) — 투명도는 그대로 두고 색만 흰색으로). */
  .brandmark { height:clamp(30px,3.4vw,58px); width:auto; opacity:.8; }
  body[data-bg="navy"] .brandmark,
  body[data-bg="black"] .brandmark { filter:brightness(0) invert(1); opacity:.7; }

  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(18px,3vh,38px); min-height:0; overflow:hidden; }
  .verse {
    width:100%; text-align:center; font-weight:700; line-height:1.55;
    word-break:keep-all; letter-spacing:-.01em;
    /* 화면 폭에 맞춰 자동으로 커진다 — 뒷자리에서도 읽혀야 한다. */
    font-size:40px;   /* 실제 크기는 draw()가 화면을 재서 px로 넣는다 */
  }
  .ln { display:block; }
  /* 다음 말씀으로 넘어갈 때는 통째로 스르르, 정답을 열 때는 채워지는 낱말만. */
  .verse, .ref { transition:opacity .26s ease, transform .26s ease; }
  .stage.leaving .verse, .stage.leaving .ref { opacity:0; transform:translateY(-12px); }
  .tk.fill { animation:pop .3s ease both; }
  @keyframes pop { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .tk { display:inline-block; margin:0 .18em; }
  .tk.shown { color:var(--ink); }
  .tk.fill { color:var(--gold); }
  .tk.blank {
    color:transparent; border-bottom:.09em solid var(--gold-dim);
    min-width:2.2em;
  }
  .ref { color:var(--dim); font-size:clamp(19px,2.6vw,44px); font-weight:600; }

  /* 자동으로 넘어갈 때 남은 시간 — 화면 맨 위 가느다란 띠가 줄어든다.
     처음에는 금색으로 두께 7px이었는데 말씀보다 그게 먼저 눈에 들어왔다.
     자리는 위 그대로 두고 색과 두께만 낮추었다 — 보려고 하면 보이되 방해하지 않는 정도로. */
  .timer {
    position:fixed; left:0; top:0; height:5px; width:100%;
    background:var(--dim); transform:scaleX(0); transform-origin:left center;
    opacity:0; z-index:15; pointer-events:none;
  }
  .timer.run { opacity:.45; }

  /* ── 조작 줄 (마우스를 움직일 때만) ───────── */
  .bar {
    /* 오른쌄 구통이로 — 가운데 두면 가운데 정렬된 요절과 겹친다. */
    position:fixed; right:18px; bottom:18px;
    display:flex; gap:8px; padding:8px; border-radius:14px;
    background:var(--veil); border:1px solid var(--line);
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .bar.on { opacity:1; pointer-events:auto; }
  .bar button {
    padding:10px 15px; border-radius:9px; border:1px solid var(--line);
    background:var(--soft); color:var(--ink); font:inherit; font-size:14.5px; cursor:pointer;
  }
  .bar button:hover { background:var(--hover); }
  .bar button.main { background:var(--gold); color:var(--on-gold); border-color:transparent; font-weight:700; }

  /* ── 끝 ─────────────────────────────────── */
  #done { align-items:center; justify-content:center; gap:26px; text-align:center; padding:24px; }
  #done h2 { margin:0; font-size:clamp(30px,5vw,56px); font-weight:800; }
  #done p { margin:0; color:var(--dim); font-size:clamp(16px,2vw,22px); }

  /* ── 정답지 ─────────────────────────────── */
  .done-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .done-btns .go { min-width:180px; }
  .go.ghost { background:var(--soft); color:var(--ink); }
  .go.ghost:hover { background:var(--hover); }

  #answers { padding:0; }
  .sheet-head {
    flex:none; display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap;
    padding:18px clamp(18px,4vw,44px); border-bottom:1px solid var(--line);
  }
  .sheet-head h2 { margin:0; font-size:22px; font-weight:800; }
  .sheet-btns { display:flex; gap:9px; }
  .sheet-btns button {
    padding:10px 16px; border-radius:10px; cursor:pointer; font:inherit; font-size:15px;
    border:1px solid var(--line); background:var(--soft); color:var(--ink);
  }
  .sheet-btns button:hover { background:var(--hover); }

  .sheet-body { flex:1; overflow-y:auto; padding:18px clamp(18px,4vw,44px) 60px; }
  .ansitem { padding:15px 0; border-bottom:1px solid var(--line); }
  .ansitem:last-child { border-bottom:none; }
  .ansref { color:var(--gold-dim); font-size:14.5px; font-weight:700; margin-bottom:5px; }
  .ansref b { color:var(--dim); margin-right:8px; font-variant-numeric:tabular-nums; }
  .anstext { font-size:18px; line-height:1.7; color:var(--ink); }
  .anstext .w { color:var(--gold); font-weight:800; text-decoration:underline; text-underline-offset:4px; }
  .anskey { margin-top:7px; font-size:15px; color:var(--dim); }
  .anskey b { color:var(--gold); font-weight:700; }

  /* 인쇄는 흰 종이에 검은 글씨로 — 화면 색을 그대로 뽑으면 잉크만 먹는다. */
  @media print {
    html, body { height:auto; background:#fff; color:#000; overflow:visible; }
    .screen { display:none !important; position:static; }
    #answers.on { display:block !important; }
    .sheet-head, .sheet-btns, .bar, .timer, #help { display:none !important; }
    .sheet-body { overflow:visible; padding:0; }
    .ansitem { border-bottom:1px solid #ccc; page-break-inside:avoid; }
    .ansref { color:#555; }
    .anstext { color:#000; }
    .anstext .w { color:#000; }
    .anskey { color:#333; }
    .anskey b { color:#000; }
  }

  /* ── 도움말 ─────────────────────────────── */
  #help {
    position:fixed; inset:0; background:var(--veil); z-index:20;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  #help.on { display:flex; }
  .helpcard { background:var(--navy-1); border:1px solid var(--line); border-radius:16px; padding:30px 34px; max-width:520px; width:100%; }
  .helpcard h3 { margin:0 0 16px; font-size:22px; }
  .krow { display:flex; justify-content:space-between; gap:18px; padding:9px 0; border-bottom:1px solid var(--line); font-size:16px; }
  .krow:last-child { border-bottom:none; }
  .krow span:first-child { color:var(--gold); font-weight:700; white-space:nowrap; }
  .krow span:last-child { color:var(--dim); text-align:right; }

  @media (prefers-reduced-motion:reduce) {
    *:not(.timer), .tk.fill { transition:none !important; animation:none !important; }
  }
</style>
</head>
<body data-bg="navy">

<!-- 설정 -->
<div class="screen on" id="setup">
  <div class="card">
    <div class="brand">
      <h1>📖 말씀 퀴즈</h1>
      <a class="back" href="../">← 성경암송으로</a>
    </div>

    <div class="field">
      <div class="lab">문제 수</div>
      <div class="opts" id="opt-n"></div>
    </div>

    <div class="field">
      <div class="lab">구절마다 빈칸</div>
      <div class="opts" id="opt-b"></div>
    </div>

    <div class="pair">
      <div class="field">
        <div class="lab">출제 순서</div>
        <div class="opts" id="opt-o"></div>
      </div>
      <div class="field">
        <div class="lab">정답</div>
        <div class="opts" id="opt-r"></div>
      </div>
    </div>

    <div class="field">
      <div class="lab">화면 넘김</div>
      <div class="row">
        <div class="opts" id="opt-a"></div>
        <div class="secs" id="secs-row">
          <input id="secs" type="number" min="2" max="180" step="1" value="8"
                 inputmode="numeric" aria-label="자동으로 넘기는 간격(초)" />
          <span>초마다</span>
        </div>
      </div>
    </div>

    <div class="field">
      <div class="lab">배경</div>
      <div class="opts" id="opt-g"></div>
    </div>

    <button class="go" id="start" disabled>말씀을 불러오는 중…</button>

  </div>
</div>

<!-- 문제 -->
<div class="screen" id="play">
  <div class="top">
    <div class="count" id="count"></div>
    <img class="brandmark" src="../marketing/church-logo.png" alt="고척교회"
         onerror="this.style.display='none'" />
  </div>
  <div class="stage">
    <div class="verse" id="verse"></div>
    <div class="ref" id="ref"></div>
  </div>
</div>

<!-- 끝 -->
<div class="screen" id="done">
  <h2>🎉 수고하셨습니다</h2>
  <p id="done-sub"></p>
  <div class="done-btns">
    <button class="go" id="sheet">📋 정답지</button>
    <button class="go ghost" id="again">다시 하기</button>
  </div>
</div>

<!-- 정답지 — 끝난 뒤에만 연다. 문제 중에 열면 큰 화면에 답이 다 보인다. -->
<div class="screen" id="answers">
  <div class="sheet-head">
    <h2>📋 정답지</h2>
    <div class="sheet-btns">
      <button id="sh-print">🖨️ 인쇄</button>
      <button id="sh-back">← 돌아가기</button>
    </div>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<!-- 자동일 때 남은 시간 -->
<div class="timer" id="timer"></div>

<!-- 조작 줄 -->
<div class="bar" id="bar">
  <button id="b-prev">← 이전</button>
  <button id="b-hint">힌트</button>
  <button class="main" id="b-next">정답 공개</button>
  <button id="b-esc">설정</button>
</div>

<!-- 도움말 -->
<div id="help">
  <div class="helpcard">
    <h3>사회자 조작키</h3>
    <div class="krow"><span>Space · → · PageDown</span><span>정답 공개 → 다음 문제</span></div>
    <div class="krow"><span>← · PageUp</span><span>이전 문제</span></div>
    <div class="krow"><span>H</span><span>빈칸 하나만 열기 (힌트)</span></div>
    <div class="krow"><span>Esc</span><span>설정으로 돌아가기</span></div>
    <div class="krow"><span>?</span><span>이 도움말</span></div>
  </div>
</div>

<script src="../js/config.js"></script>
<script>
(function () {
  "use strict";

  // 0 = 전체(있는 말씀 전부). 부서마다 진도가 달라 「전체」를 자주 쓰신다.
  var N_OPTS = [10, 15, 20, 25, 0];
  // 빈칸 0 = 빈칸 없이 말씀만 큰 화면에(다 함께 읽을 때).
  // -1 = 전체 — 낱말을 하나도 남기지 않는다. 앱의 3단계 암송과 같은 난이도다.
  var B_OPTS = [0, 1, 2, 3, -1];
  // 0 = 구절 번호 차례대로(진도 순), 1 = 섞어서.
  var O_OPTS = [0, 1];
  // 0 = 사회자가 넘긴다, 1 = 정해진 초마다 저절로.
  var A_OPTS = [0, 1];
  var G_OPTS = ["navy", "black", "white", "cream"];
  var G_NAME = { navy: "남색", black: "검정", white: "흰색", cream: "미색" };
  // 1 = 정답을 한 번 보여주고 넘어간다, 0 = 보여주지 않고 바로 다음 말씀으로.
  var R_OPTS = [1, 0];
  var nPick = 10, bPick = 2, oPick = 1, aPick = 0, rPick = 1, gPick = "navy", autoSec = 8;
  var autoTimer = null;
  var verses = [], quiz = [], idx = 0, revealed = false;

  var $ = function (id) { return document.getElementById(id); };
  function show(id) {
    ["setup", "play", "done", "answers"].forEach(function (s) {
      $(s).classList.toggle("on", s === id);
    });
  }

  // ── 설정 단추 ─────────────────────────────
  function buildOpts(host, list, label, get, set) {
    host.innerHTML = "";
    list.forEach(function (v) {
      var b = document.createElement("button");
      b.className = "opt";
      b.type = "button";
      b.textContent = label(v);
      b.dataset.v = v;
      b.setAttribute("aria-pressed", String(get() === v));
      b.onclick = function () {
        set(v);
        Array.prototype.forEach.call(host.children, function (c) {
          // 값이 숫자일 수도 글자일 수도 있다(배경 이름).
          var cv = typeof v === "number" ? Number(c.dataset.v) : c.dataset.v;
          c.setAttribute("aria-pressed", String(cv === v));
        });
      };
      host.appendChild(b);
    });
  }
  buildOpts($("opt-n"), N_OPTS, function (v) { return v === 0 ? "전체" : v; },
    function () { return nPick; }, function (v) { nPick = v; });
  buildOpts($("opt-b"), B_OPTS, function (v) { return v < 0 ? "전체" : v; },
    function () { return bPick; }, function (v) { bPick = v; });
  buildOpts($("opt-o"), O_OPTS, function (v) { return v === 0 ? "순서대로" : "무작위로"; },
    function () { return oPick; }, function (v) { oPick = v; });
  buildOpts($("opt-a"), A_OPTS, function (v) { return v === 0 ? "수동" : "자동"; },
    function () { return aPick; }, function (v) {
      aPick = v;
      $("secs-row").classList.toggle("on", v === 1);
    });
  buildOpts($("opt-r"), R_OPTS, function (v) { return v === 1 ? "정답 공개" : "공개 안 함"; },
    function () { return rPick; }, function (v) { rPick = v; });
  // 배경은 고르는 즉시 화면에 반영한다 — 눌러 보고 정하시게.
  buildOpts($("opt-g"), G_OPTS, function (v) { return G_NAME[v]; },
    function () { return gPick; }, function (v) { gPick = v; document.body.dataset.bg = v; });
  $("secs").addEventListener("change", function () {
    var n = Math.round(Number(this.value) || 0);
    autoSec = Math.min(180, Math.max(2, n));   // 너무 짧으면 읽을 새가 없다
    this.value = autoSec;
  });

  // ── 말씀 불러오기 ─────────────────────────
  function loadVerses() {
    var S = window.SUPA;
    return fetch(S.URL + "/functions/v1/api", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": S.ANON,
        "Authorization": "Bearer " + S.ANON
      },
      body: JSON.stringify({ action: "getVerses" })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) throw new Error("불러오기 실패");
      return (d.verses || []).filter(function (v) {
        return v && String(v.text || "").trim().split(/\s+/).length >= 4;
      });
    });
  }

  // ── 문제 만들기 ───────────────────────────
  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ── 의미 단위 줄바꿈 ──
  //   개역개정 본문에는 쉼표가 한 구절도 없다(35구절 중 0개) — 문장부호로는 못 끊는다.
  //   대신 어말을 본다: 연결어미(~고·~며·~니·~사…) 뒤는 끊기 좋고,
  //   ⚠️ 관형격 「의」와 관형사(그·이·모든…) 뒤는 절대 끊지 않는다 —
  //   「따랐은즉 그의 / 자손이」처럼 갈라지면 뜻이 끊긴다(실제로 그랬다).
  //   그리고 줄 길이 균형을 더 무겁게 둔다 — 한 단어만 남는 줄이 가장 보기 나쁘다.
  var CONN = "고며니사여면서되즉야요자나";
  var CASE = "은는이가을를에로와과도";
  var DET = ["그", "이", "저", "한", "온", "각", "모든", "네", "내", "우리", "주의"];

  function breakScore(tok) {
    var t = String(tok).replace(/["\u201d\u2019]+$/, "");
    if (!t || DET.indexOf(t) >= 0) return -5;
    var last = t.charAt(t.length - 1);
    if (last === "의") return -5;
    if (CONN.indexOf(last) >= 0) return 3;
    if (CASE.indexOf(last) >= 0) return 1;
    return 0;
  }

  function range(a, b) { var r = []; for (var i = a; i < b; i++) r.push(i); return r; }

  // 토큰 인덱스를 줄별로 묶어 돌려준다.
  // 줄 수는 밖에서 정해 준다 — 예전엔 여기서 글자 수로 혼자 정했는데,
  // 글씨 크기를 따로 정하다 보니 둘이 어긋나면 한 줄이 또 접혀 화면 밖으로 넘쳤다.
  function layout(tokens, lines) {
    lines = Math.max(1, Math.min(tokens.length, lines));
    if (lines === 1) return [range(0, tokens.length)];
    // 균형은 어절 '개수'가 아니라 '글자 수'로 잰다 — 개수로 재면
    // 「너와」 한 낱말만 남는 줄이 생긴다(실제로 그랬다).
    var target = tokens.join(" ").length / lines;
    var out = [], start = 0;
    for (var k = 1; k < lines; k++) {
      var best = -1e9, bi = start + 1;
      var hi = tokens.length - (lines - k - 1);
      for (var j = start + 1; j < hi; j++) {
        var chars = j - start - 1;                       // 낱말 사이 공백
        for (var m = start; m < j; m++) chars += Array.from(tokens[m]).length;
        var sc = breakScore(tokens[j - 1]) - Math.abs(chars - target) * 0.55;
        if (sc > best) { best = sc; bi = j; }
      }
      out.push(range(start, bi)); start = bi;
    }
    out.push(range(start, tokens.length));
    return out.filter(function (l) { return l.length; });
  }

  // 줄 수를 1..6으로 바꿔 보며 글씨가 가장 커지는 쪽을 고른다.
  //   가로는 「글자 수 + 어절마다 여백(.36em)」으로, 세로는 줄 수 × 줄높이로 잰다.
  function fitVerse(tokens, availW, availH) {
    var best = null, max = Math.min(6, tokens.length);
    for (var n = 1; n <= max; n++) {
      var ls = layout(tokens, n);
      if (ls.length !== n) continue;
      var widest = 0;
      ls.forEach(function (l) {
        var chars = 0;
        l.forEach(function (i) { chars += Array.from(tokens[i]).length; });
        var w = chars + 0.36 * l.length;
        if (w > widest) widest = w;
      });
      var px = Math.min(availW / widest, availH / (n * 1.55));
      if (!best || px > best.px) best = { px: px, ls: ls };
    }
    return best;
  }

  // 두 글자 이상인 어절만 후보로 — '은·이요' 같은 조사가 비면 문제가 시시해진다.
  // (앱의 pickEventBlankIndex와 같은 기준)
  function pickBlanks(tokens, want) {
    // 전체 — 「절반을 넘지 않는다」는 상한을 적용하지 않는다. 다 비우는 것이 목적이다.
    if (want < 0) return tokens.map(function (_, i) { return i; });
    var cand = [];
    tokens.forEach(function (t, i) {
      if (Array.from(t).length >= 2) cand.push(i);
    });
    if (!cand.length) cand = tokens.map(function (_, i) { return i; });
    // ⚠️ 짧은 구절 보호 — 어절의 절반을 넘기면 남는 글자가 없어 문제가 안 된다.
    var cap = Math.max(1, Math.floor(tokens.length / 2));
    var n = Math.min(want, cap, cand.length);

    // 붙어 있는 칸은 피해 흔뚜린다 — 짧은 구절에서 끝 세 칸이 나란히 비면
    //   떠올릴 실마리가 없어 손을 못 드신다(마 10:31 · 6어절에서 실제로 그랬다).
    //   떨어뜨리려다 모자라면 나머지를 채운다 — 개수가 먼저다.
    var order = shuffled(cand), picked = [];
    order.forEach(function (i) {
      if (picked.length >= n) return;
      var touching = picked.some(function (p) { return Math.abs(p - i) <= 1; });
      if (!touching) picked.push(i);
    });
    order.forEach(function (i) {
      if (picked.length < n && picked.indexOf(i) < 0) picked.push(i);
    });
    return picked.sort(function (a, b) { return a - b; });
  }

  function build() {
    var take = nPick === 0 ? verses.length : Math.min(nPick, verses.length);
    // 「순서대로」면 구절 번호 차례 — 문제 수를 줄이면 앞에서부터(배운 데까지) 나온다.
    var pool = oPick ? shuffled(verses) : verses.slice().sort(function (a, b) {
      return (Number(a.no) || 0) - (Number(b.no) || 0);
    });
    quiz = pool.slice(0, take).map(function (v) {
      var tokens = String(v.text || "").trim().split(/\s+/);
      return {
        tokens: tokens,
        blanks: pickBlanks(tokens, bPick),
        // 전체 이름으로 — 큰 화면에서는 「마 28:19」보다 「마태복음 28장 19절」이 읽힌다.
        ref: v.refFull || v.refShort || ("No." + v.no),
        hinted: []
      };
    });
    idx = 0; revealed = false;
  }

  // ── 그리기 ────────────────────────────────
  function draw() {
    var q = quiz[idx];
    if (!q) return finish();
    $("count").textContent = (idx + 1) + " / " + quiz.length;
    $("ref").textContent = q.ref;

    function cell(i) {
      var t = q.tokens[i];
      var isBlank = q.blanks.indexOf(i) >= 0;
      var open = revealed || q.hinted.indexOf(i) >= 0;
      var esc = t.replace(/[&<>]/g, function (m) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m];
      });
      if (!isBlank) return '<span class="tk shown">' + esc + "</span>";
      if (open) return '<span class="tk fill">' + esc + "</span>";
      // 빈칸 너비를 글자 수만큼 — 몇 글자인지가 힌트가 된다(손드는 퀴즈에 알맞다).
      return '<span class="tk blank" style="min-width:' +
        (Array.from(t).length * 1.05) + 'em">' + esc + "</span>";
    }
    var el = $("verse"), stage = el.parentNode;
    var availW = stage.clientWidth;
    var availH = Math.max(80, stage.clientHeight - $("ref").offsetHeight - 28);

    var fit = fitVerse(q.tokens, availW, availH) || { px: 40, ls: [range(0, q.tokens.length)] };
    el.innerHTML = fit.ls.map(function (line) {
      return '<div class="ln">' + line.map(cell).join(" ") + "</div>";
    }).join("");

    // 계산으로 한 번 놓고, 실제로 넘치면 줄인다 — 글꼴마다 글자 폭이 조금씩 달라
    // 계산만으로는 딱 맞지 않는다. 화면이 넘치는 것보다 조금 작은 편이 낫다.
    var px = Math.max(24, Math.min(fit.px, 170));
    el.style.fontSize = px + "px";
    for (var g = 0; g < 24 && (el.scrollHeight > availH || el.scrollWidth > availW + 1); g++) {
      px *= 0.94;
      if (px < 24) { px = 24; el.style.fontSize = px + "px"; break; }
      el.style.fontSize = px + "px";
    }

    var willReveal = rPick && !revealed && q.blanks.length;
    $("b-next").textContent = willReveal ? "정답 공개" : "다음 문제 →";
    $("b-hint").disabled = revealed || !q.blanks.length;
    armAuto();
  }

  // 다음 말씀으로 넘어갈 때 스르르 — 글씨 재기는 투명도와 무관하니 그대로 정확하다.
  var fading = false;
  function fade(fn) {
    var st = document.querySelector(".stage");
    fading = true;
    st.classList.add("leaving");
    setTimeout(function () {
      fn(); st.classList.remove("leaving"); fading = false;
    }, 190);
  }

  // 정답지 — 빈칸이던 낱말을 밑줄·금색으로 표시하고 아래에 답만 따로 모은다.
  function buildSheet() {
    var esc = function (t) {
      return String(t).replace(/[&<>]/g, function (m) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m];
      });
    };
    $("sheet-body").innerHTML = quiz.map(function (q, n) {
      var body = q.tokens.map(function (t, i) {
        return q.blanks.indexOf(i) >= 0
          ? '<span class="w">' + esc(t) + "</span>" : esc(t);
      }).join(" ");
      var keys = q.blanks.map(function (i) { return esc(q.tokens[i]); });
      return '<div class="ansitem">' +
        '<div class="ansref"><b>' + (n + 1) + ".</b>" + esc(q.ref) + "</div>" +
        '<div class="anstext">' + body + "</div>" +
        '<div class="anskey">' + (keys.length
          ? "정답 &nbsp;<b>" + keys.join("</b> · <b>") + "</b>"
          : "빈칸 없음") + "</div>" +
        "</div>";
    }).join("");
  }

  function finish() {
    stopAuto();
    show("done");
    $("done-sub").textContent = quiz.length + "문제를 마쳤습니다.";
  }

  // ── 진행 ──────────────────────────────────
  // 사회자가 직접 넘겨도 타이머는 다시 시작한다 — draw()가 매번 건다.
  function armAuto() {
    clearTimeout(autoTimer);
    var t = $("timer");
    if (!aPick || !$("play").classList.contains("on")) {
      t.classList.remove("run");
      t.style.transition = "none";
      t.style.transform = "scaleX(0)";
      return;
    }
    autoTimer = setTimeout(next, autoSec * 1000);
    // 가득 찬 상태로 되돌린 뒤 정해진 초에 걸쳐 줄어들게 한다.
    t.style.transition = "none";
    t.style.transform = "scaleX(1)";
    t.classList.add("run");
    void t.offsetWidth;                       // 되돌린 것을 먼저 반영시킨다
    t.style.transition = "transform " + autoSec + "s linear";
    t.style.transform = "scaleX(0)";
  }
  function stopAuto() {
    clearTimeout(autoTimer); autoTimer = null;
    var t = $("timer");
    t.classList.remove("run");
    t.style.transition = "none";
    t.style.transform = "scaleX(0)";
  }

  function next() {
    if (fading) return;          // 넘어가는 중에 또 누르면 한 문제를 건너뛴다
    var q = quiz[idx];
    // 빈칸이 없으면 공개할 것이 없다 — 한 번 누르면 바로 다음 말씀으로.
    if (rPick && !revealed && q && q.blanks.length) { revealed = true; draw(); return; }
    revealed = false; idx++;
    if (idx >= quiz.length) { stopAuto(); return finish(); }
    fade(draw);
  }
  function prev() {
    if (fading) return;
    if (idx === 0 && !revealed) return;
    if (revealed) { revealed = false; return draw(); }
    idx = Math.max(0, idx - 1); revealed = false; fade(draw);
  }
  function hint() {
    var q = quiz[idx];
    if (!q || revealed) return;
    var left = q.blanks.filter(function (i) { return q.hinted.indexOf(i) < 0; });
    if (!left.length) { revealed = true; return draw(); }
    q.hinted.push(left[Math.floor(Math.random() * left.length)]);
    draw();
  }
  function toSetup() { stopAuto(); show("setup"); }

  function begin() {
    // 입력칸에서 곧바로 시작하기를 누르면 change가 안 올 수 있어 여기서 한 번 더 읽는다.
    var n = Math.round(Number($("secs").value) || 0);
    autoSec = Math.min(180, Math.max(2, n));
    $("secs").value = autoSec;
    build();
    if (!quiz.length) return;
    show("play"); draw();
  }

  // ── 조작 ──────────────────────────────────
  document.addEventListener("keydown", function (e) {
    if ($("help").classList.contains("on")) {
      if (e.key === "Escape" || e.key === "?" || e.key === "/") $("help").classList.remove("on");
      return;
    }
    if (e.key === "?" || (e.shiftKey && e.key === "/")) { $("help").classList.add("on"); return; }
    if (!$("play").classList.contains("on")) return;
    // 리모컨은 대개 → · ← · PageDown · PageUp 을 보낸다.
    if (e.key === " " || e.key === "ArrowRight" || e.key === "PageDown" || e.key === "Enter") {
      e.preventDefault(); next();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); prev();
    } else if (e.key === "h" || e.key === "H" || e.key === "ㅗ") {
      e.preventDefault(); hint();
    } else if (e.key === "Escape") {
      e.preventDefault(); toSetup();
    }
  });

  var reTimer = null;
  window.addEventListener("resize", function () {
    if (!$("play").classList.contains("on")) return;
    clearTimeout(reTimer);
    reTimer = setTimeout(draw, 120);   // 빔에 연결하면 해상도가 바뀐다
  });

  $("b-next").onclick = next;
  $("b-prev").onclick = prev;
  $("b-hint").onclick = hint;
  $("b-esc").onclick = toSetup;
  $("start").onclick = begin;
  $("again").onclick = toSetup;
  $("sheet").onclick = function () { buildSheet(); show("answers"); };
  $("sh-back").onclick = function () { show("done"); };
  $("sh-print").onclick = function () { window.print(); };

  // 조작 줄 — 마우스를 움직일 때만 잠깐 뜬다. 평소엔 말씀만 보인다.
  var barTimer = null;
  document.addEventListener("mousemove", function () {
    if (!$("play").classList.contains("on")) return;
    $("bar").classList.add("on");
    clearTimeout(barTimer);
    barTimer = setTimeout(function () { $("bar").classList.remove("on"); }, 2500);
  });

  // ── 시작 ──────────────────────────────────
  loadVerses().then(function (list) {
    verses = list;
    var btn = $("start");
    if (!verses.length) { btn.textContent = "말씀이 없습니다"; return; }
    btn.disabled = false;
    btn.textContent = "시작하기 (말씀 " + verses.length + "개)";
  }).catch(function () {
    $("start").textContent = "불러오지 못했습니다 — 새로고침해 주세요";
  });
})();
</script>
</body>
</html>
